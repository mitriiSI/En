name: Publish lecture materials to mitii.ru via SSH

# Deployment is inactive until the repository variable
# MITII_DEPLOY_ENABLED is explicitly set to "true".
# Do not publish site code managed by Codex. Only selected lecture assets may be uploaded.
# It uses a dedicated deploy key, not a website login password.
on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "data/tests/**"
      - "lib/*3d*.js"
      - "media/**"
      - "presentations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mitii-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.MITII_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH authentication
        shell: bash
        env:
          SSH_KEY: ${{ secrets.MITII_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MITII_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_KEY:-}" || -z "${SSH_KNOWN_HOSTS:-}" ]]; then
            echo "Configure MITII_SSH_KEY and MITII_SSH_KNOWN_HOSTS in Actions secrets." >&2
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/mitii_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/mitii_deploy" "$HOME/.ssh/known_hosts"

      - name: Select changed lecture files only
        id: files
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${BEFORE_SHA:-}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git diff --name-only --diff-filter=AM "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/all-changed.txt"
          : > "$RUNNER_TEMP/lecture-files.txt"
          while IFS= read -r file; do
            case "$file" in
              content/*.md|data/tests/*.json|media/*|presentations/*)
                [[ -f "$file" ]] && printf '%s\n' "$file" >> "$RUNNER_TEMP/lecture-files.txt"
                ;;
              lib/*3d*.js)
                case "$file" in
                  lib/scene3d.js|lib/widgets3d.js) ;;
                  *) [[ -f "$file" ]] && printf '%s\n' "$file" >> "$RUNNER_TEMP/lecture-files.txt" ;;
                esac
                ;;
            esac
          done < "$RUNNER_TEMP/all-changed.txt"
          if [[ -s "$RUNNER_TEMP/lecture-files.txt" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/lecture-files.txt"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No lecture files changed; nothing to deploy."
          fi

      - name: Upload selected lecture files only
        if: steps.files.outputs.has_changes == 'true'
        shell: bash
        env:
          DEPLOY_HOST: 193.227.240.200
          DEPLOY_USER: ${{ secrets.MITII_SSH_USER }}
          DEPLOY_PORT: ${{ secrets.MITII_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.MITII_REMOTE_DIR }}
        run: |
          set -euo pipefail
          : "${DEPLOY_USER:?MITII_SSH_USER is missing}"
          : "${DEPLOY_PATH:?MITII_REMOTE_DIR is missing}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || exit 1
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9._-]+$ ]] || exit 1
          if [[ "$DEPLOY_PATH" != "/srv/mitii" ]]; then
            echo "Only /srv/mitii is an approved publish target." >&2
            exit 1
          fi
          ssh -i "$HOME/.ssh/mitii_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -d '$DEPLOY_PATH' && test -w '$DEPLOY_PATH' && test -f /srv/mitii-deploy/compose.yaml"
          rsync -az --checksum --no-owner --no-group --no-perms \
            --files-from="$RUNNER_TEMP/lecture-files.txt" \
            -e "ssh -i $HOME/.ssh/mitii_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          # Deliberately never copy index.html, data/sections.json, global JS,
          # configuration, Docker files or other Codex-managed site code.
          # No --delete, no git reset, and no unrelated container restarts.

      - name: Rebuild only the web service
        if: steps.files.outputs.has_changes == 'true'
        shell: bash
        env:
          DEPLOY_HOST: 193.227.240.200
          DEPLOY_USER: ${{ secrets.MITII_SSH_USER }}
          DEPLOY_PORT: ${{ secrets.MITII_SSH_PORT }}
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -i "$HOME/.ssh/mitii_deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker compose -f /srv/mitii-deploy/compose.yaml up -d --no-deps --build web"
