name: Check live lecture versions for inline learning
on:
  push:
    branches: [deploy/inline-learning-vps]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Compare approved lecture paths
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.MITII_SSH_KEY }}
          HOST_KEYS: ${{ secrets.MITII_SSH_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.MITII_SSH_USER }}
          DEPLOY_PORT: ${{ secrets.MITII_SSH_PORT }}
        run: |
          set -euo pipefail
          umask 077
          deploy_port="${DEPLOY_PORT:-22}"
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9._-]+$ && "$deploy_port" =~ ^[0-9]{1,5}$ && -n "$DEPLOY_KEY" && -n "$HOST_KEYS" ]]
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/lecture-key"
          printf '%s\n' "$HOST_KEYS" > "$RUNNER_TEMP/known-hosts"
          git diff --name-only cfdb332744b620cfff74f6573af41b7dcb64427a 191c65be30aae6eb1860c9e1a30a3843b1eddcfe |
            awk '/^content\/[a-z0-9-]+\.md$/ || /^lib\/upravlenie3d-common\.js$/ || /^media\/study\/inline-learning\.(css|js)$/' > "$RUNNER_TEMP/lecture-paths"
          printf '%s\n' 'content/ekonomika-lekciya-16-11.md' >> "$RUNNER_TEMP/lecture-paths"
          ssh -i "$RUNNER_TEMP/lecture-key" -p "$deploy_port" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known-hosts" \
            "$DEPLOY_USER@193.227.240.200" '
              set -eu
              cd /srv/mitii
              while IFS= read -r f; do
                if [ -f "$f" ]; then
                  test -r "$f"
                  sha256sum "$f"
                else
                  printf "MISSING %s\n" "$f"
                fi
              done
              if [ -r content/ekonomika-lekciya-16-11.md ]; then
                awk "/^#{2,4} /" content/ekonomika-lekciya-16-11.md
              fi
              if grep -q "upravlenie3d-common[.]js" index.html; then
                printf "%s\n" "Inline widget host is loaded by live index"
              fi
            ' < "$RUNNER_TEMP/lecture-paths"
