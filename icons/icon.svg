<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="18%" r="95%">
      <stop offset="0" stop-color="#14306f"/><stop offset=".55" stop-color="#081436"/><stop offset="1" stop-color="#030819"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2f8cff" stop-opacity=".9"/><stop offset="1" stop-color="#2f8cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowO" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff8a1f" stop-opacity=".85"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fd4ff"/><stop offset=".45" stop-color="#2f8cff"/><stop offset="1" stop-color="#1546c9"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc27a"/><stop offset=".5" stop-color="#ff8a1f"/><stop offset="1" stop-color="#e2560a"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".16"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".45" stop-color="#bfe6ff" stop-opacity=".15"/><stop offset="1" stop-color="#ffb46b" stop-opacity=".7"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="sq"><rect width="512" height="512" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="150" cy="140" r="210" fill="url(#glowB)"/>
    <circle cx="400" cy="410" r="190" fill="url(#glowO)" opacity=".8"/>
    <!-- orange orb -->
    <circle cx="318" cy="314" r="104" fill="url(#orange)"/>
    <ellipse cx="290" cy="262" rx="58" ry="26" fill="#fff" opacity=".35" transform="rotate(-28 290 262)"/>
    <!-- blue orb -->
    <circle cx="206" cy="208" r="122" fill="url(#blue)"/>
    <ellipse cx="170" cy="140" rx="70" ry="30" fill="#fff" opacity=".38" transform="rotate(-30 170 140)"/>
    <!-- liquid glass lens across both -->
    <rect x="96" y="214" width="320" height="120" rx="60" fill="url(#glass)" transform="rotate(-24 256 274)"/>
    <rect x="96" y="214" width="320" height="120" rx="60" fill="none" stroke="url(#rim)" stroke-width="5" transform="rotate(-24 256 274)"/>
    <rect x="122" y="226" width="200" height="16" rx="8" fill="#fff" opacity=".45" transform="rotate(-24 256 274)"/>
    <!-- spark -->
    <circle cx="392" cy="134" r="14" fill="#ff8a1f"/><circle cx="392" cy="134" r="30" fill="#ff8a1f" opacity=".22"/>
  </g>
</svg>
