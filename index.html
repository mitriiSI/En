<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учебный хаб</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Учебный хаб">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1220">
<style>
  :root {
    --bg: #0f1220; --panel: #171b30; --panel2: #1f2440; --line: #2b3154;
    --ink: #eef0f8; --muted: #9aa2c0; --accent: #7aa2ff; --gold: #f0c36b; --ok: #4cc38a; --bad: #ef6b5b; --demand: #6fa0ff; --supply: #ff8f66;
    --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f3f4fa; --panel:#fff; --panel2:#eceef8; --line:#dcdff0; --ink:#1b1f33; --muted:#626a8a; --accent:#2f5bd9; --gold:#a86f00; --demand:#2f6fe0; --supply:#d9582b; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  header { display: flex; align-items: center; gap: 8px; padding: calc(var(--top) + 10px) 14px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
  header h1 { flex: 1; margin: 0; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ib { border: 1px solid var(--line); background: var(--panel2); border-radius: 12px; min-width: 42px; height: 42px; padding: 0 12px; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .ib:active { transform: scale(.96); }
  .ib.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .ib.danger { color: var(--bad); }
  #back { display: none; font-size: 22px; padding: 0 14px; }
  body.sub #back { display: inline-flex; }

  #view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: var(--bot); }
  .page { max-width: 860px; margin: 0 auto; padding: 18px 16px 60px; }

  /* home */
  .hello { font-size: 28px; font-weight: 800; margin: 4px 0 2px; }
  .sub-t { color: var(--muted); margin: 0 0 18px; }
  .search { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 16px; cursor: pointer; min-height: 130px; display: flex; flex-direction: column; justify-content: space-between; transition: transform .15s, border-color .15s; }
  .tile:active { transform: scale(.97); }
  .tile:hover { border-color: var(--accent); }
  .tile .ico { font-size: 34px; line-height: 1; }
  .tile h3 { margin: 10px 0 0; font-size: 18px; }
  .tile small { color: var(--muted); }
  .tile.add { border-style: dashed; align-items: center; justify-content: center; text-align: center; color: var(--muted); }
  .hits { display: grid; gap: 8px; }

  /* list */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .list { display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; cursor: pointer; }
  .row:active { transform: scale(.99); }
  .row .num { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--panel2); display: grid; place-items: center; font-size: 13px; color: var(--muted); font-weight: 700; }
  .row .tt { flex: 1; min-width: 0; }
  .row .tt b { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .row .tt small { color: var(--muted); }
  .row .go { color: var(--muted); font-size: 20px; }
  .row .tools { display: flex; gap: 6px; }
  .row .tools .ib { min-width: 38px; height: 38px; padding: 0 8px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; border: 1px dashed var(--line); border-radius: 18px; }
  .foot-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }

  /* documents */
  .doc h1 { font-size: 28px; line-height: 1.2; margin-top: 0; }
  .doc h2 { margin-top: 1.8em; padding-top: .4em; border-top: 1px solid var(--line); color: var(--gold); }
  .doc blockquote { margin: 1em 0; padding: .5em 1em; border-left: 4px solid var(--accent); background: var(--panel2); border-radius: 0 12px 12px 0; }
  .doc blockquote p { margin: .3em 0; }
  .doc table { border-collapse: collapse; width: 100%; font-size: 15px; display: block; overflow-x: auto; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  .doc th { background: var(--panel2); }
  .doc code { background: var(--panel2); padding: 1px 5px; border-radius: 6px; }
  .doc pre { background: var(--panel2); padding: 12px; border-radius: 12px; overflow-x: auto; white-space: pre-wrap; }
  .doc img { max-width: 100%; height: auto; }
  .pn { display: flex; gap: 10px; margin-top: 32px; }
  .pn .ib { flex: 1; height: auto; min-height: 46px; padding: 8px 12px; text-align: left; justify-content: flex-start; }

  .pagewrap { width: 100%; height: 100%; background: #fff; }
  iframe.pf { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  body.fs .pagewrap { position: fixed; inset: 0; z-index: 50; }
  #fsExit { display: none; position: fixed; top: calc(var(--top) + 10px); right: 10px; z-index: 60; background: rgba(0,0,0,.72); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 12px; padding: 10px 14px; }
  body.fs #fsExit { display: block; }

  /* flashcards */
  .fc { max-width: 640px; margin: 0 auto; padding: 22px 16px 60px; text-align: center; }
  .fc .progress { color: var(--muted); margin-bottom: 12px; }
  .fc .bar { height: 6px; background: var(--panel2); border-radius: 6px; overflow: hidden; margin-bottom: 18px; }
  .fc .bar i { display: block; height: 100%; background: var(--ok); transition: width .3s; }
  .flipwrap { perspective: 1000px; }
  .card3 { position: relative; height: 290px; border-radius: 24px; border: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; justify-content: center; padding: 34px 22px 38px; font-size: 21px; font-weight: 600; line-height: 1.4; box-shadow: 0 10px 30px rgba(0,0,0,.25); cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; transition: transform .18s ease-in; }
  .card3.turn { transform: rotateY(90deg); }
  .card3.back { background: color-mix(in srgb, var(--accent) 20%, var(--panel)); border-color: var(--accent); font-weight: 500; }
  .card3 .lab { position: absolute; top: 13px; left: 18px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .card3.back .lab { color: var(--accent); }
  .card3 .tap { position: absolute; bottom: 12px; left: 0; right: 0; font-size: 12px; font-weight: 400; color: var(--muted); }
  .fc .brow { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .fc .hint { margin-top: 14px; color: var(--muted); font-size: 13px; }


  /* интерактивные блоки внутри конспекта */
  .wg { margin: 22px 0; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 6px 22px rgba(0,0,0,.18); }
  .wg-h { display: flex; align-items: center; gap: 10px; font-size: 18px; }
  .wg-badge { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 9px; }
  .wg-lead { margin: 6px 0 12px; color: var(--muted); font-size: 15px; }
  .wg svg { width: 100%; height: auto; display: block; background: var(--panel2); border-radius: 14px; touch-action: manipulation; }
  .wg svg text { fill: var(--ink); font-size: 13px; font-family: inherit; }
  .wg-ax { stroke: var(--muted); stroke-width: 1.5; }
  .wg-grid { stroke: var(--line); stroke-width: 1; }
  .wg-ctl { margin: 14px 0 4px; display: grid; gap: 10px; }
  .wg-ctl label { display: flex; align-items: center; gap: 10px; font-size: 14px; margin: 0; color: var(--ink); }
  .wg-ctl .n { min-width: 130px; }
  .wg-ctl input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .wg-ctl b { min-width: 40px; text-align: right; }
  .wg-out { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--panel2); font-size: 15px; }
  .wg-out b { color: var(--gold); }
  .wg-chips { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 10px; }
  .wg-chip { flex: 1 1 130px; border: 2px solid var(--line); background: var(--panel2); border-radius: 16px; padding: 12px; text-align: left; }
  .wg-chip.on { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 18%, var(--panel2)); }
  .wg-chip.off { opacity: .55; }
  .wg-chip small { display: block; color: var(--muted); }
  .wg-meter { height: 24px; border-radius: 12px; background: var(--panel2); overflow: hidden; border: 1px solid var(--line); }
  .wg-meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .25s, background .25s; }
  .wg-meter.over i { background: var(--bad); }
  .wg-legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .wg-legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  @media (max-width: 520px) { .wg-ctl label { flex-wrap: wrap; } .wg-ctl .n { min-width: 100%; } }

  /* modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-end; justify-content: center; z-index: 30; }
  .modal-bg.on { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 20px 18px calc(18px + var(--bot)); width: min(600px, 100%); max-height: 92dvh; overflow-y: auto; }
  @media (min-width: 700px) { .modal-bg { align-items: center; } .modal { border-radius: 22px; } }
  .modal h2 { margin: 0 0 8px; font-size: 20px; }
  .modal label { display: block; margin: 12px 0 4px; font-size: 13px; color: var(--muted); }
  .modal input[type=text], .modal select, .modal textarea { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); }
  .modal textarea { min-height: 150px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal .note { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .modal .or { text-align: center; color: var(--muted); margin: 14px 0 0; font-size: 13px; }
  .toast { position: fixed; bottom: calc(24px + var(--bot)); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; opacity: 0; transition: all .25s; z-index: 70; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.on { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>

<header>
  <button class="ib" id="back" aria-label="Назад">‹</button>
  <h1 id="title">Учебный хаб</h1>
  <span id="acts" style="display:flex;gap:8px"></span>
</header>
<div id="view"></div>

<button id="fsExit">✕ Закрыть</button>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" multiple accept=".docx,.md,.markdown,.txt,.html,.htm" hidden>

<script src="lib/marked.min.js"></script>
<script src="lib/purify.min.js"></script>
<script src="lib/widgets.js"></script>
<script>
(function () {
  'use strict';
  var base = { sections: [] };
  var user = { sections: [], items: [], order: {} };
  var editing = false;
  var cardKeys = null;

  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var uid = function (p) { return p + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36); };
  var TYPE = { markdown: 'конспект', doc: 'конспект', cards: 'карточки', page: 'страница', link: 'ссылка' };

  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 2600);
  }

  /* ---------- storage (IndexedDB, запасной вариант — localStorage) ---------- */
  var LS = 'hub.user.v1', DB = 'hub-db', ST = 'kv';
  function idb() {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) return rej();
      var r = indexedDB.open(DB, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(ST); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function idbGet() {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var q = db.transaction(ST).objectStore(ST).get('user');
        q.onsuccess = function () { res(q.result); }; q.onerror = function () { rej(q.error); };
      });
    });
  }
  function idbPut(v) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(ST, 'readwrite'); tx.objectStore(ST).put(v, 'user');
        tx.oncomplete = res; tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function norm(v) { v = v || {}; return { sections: v.sections || [], items: v.items || [], order: v.order || {} }; }
  function loadUser() {
    return idbGet().then(function (v) { if (v) return norm(v); throw 0; })
      .catch(function () { try { return norm(JSON.parse(localStorage.getItem(LS))); } catch (e) { return norm(); } });
  }
  function save() {
    idbPut(user).catch(function () {
      try { localStorage.setItem(LS, JSON.stringify(user)); } catch (e) { toast('Не удалось сохранить'); }
    });
  }
  if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }

  /* ---------- data ---------- */
  function sections() {
    var out = base.sections.map(function (s) { return { id: s.id, title: s.title, icon: s.icon, user: false }; });
    user.sections.forEach(function (s) { out.push({ id: s.id, title: s.title, icon: s.icon, user: true }); });
    return out;
  }
  function section(id) { return sections().filter(function (s) { return s.id === id; })[0]; }
  function itemsOf(sid) {
    var items = [];
    base.sections.forEach(function (s) { if (s.id === sid) s.items.forEach(function (i) { items.push(i); }); });
    user.items.forEach(function (i) { if (i.sectionId === sid) items.push(Object.assign({ user: true }, i)); });
    var ord = user.order[sid];
    if (ord && ord.length) {
      var pos = function (i) { var k = ord.indexOf(i.id); return k < 0 ? 1e6 : k; };
      items = items.map(function (i, n) { return [i, n]; }).sort(function (a, b) { return (pos(a[0]) - pos(b[0])) || (a[1] - b[1]); }).map(function (p) { return p[0]; });
    }
    return items;
  }
  function itemById(sid, iid) { return itemsOf(sid).filter(function (i) { return i.id === iid; })[0]; }
  /* блоки внутри предмета: конспекты, карточки, презентации */
  var GROUPS = [{ id: 'notes', title: 'Конспекты', icon: '📝' }, { id: 'cards', title: 'Карточки', icon: '🃏' }, { id: 'pages', title: 'Презентации', icon: '🎞️' }, { id: 'other', title: 'Другое', icon: '📎' }];
  function groupOf(i) { return i.group || (i.type === 'cards' ? 'cards' : (i.type === 'markdown' || i.type === 'doc') ? 'notes' : i.type === 'page' ? 'pages' : 'other'); }
  function groupsOf(sid) { var items = itemsOf(sid); return GROUPS.filter(function (g) { return items.some(function (i) { return groupOf(i) === g.id; }); }); }
  function group(gid) { return GROUPS.filter(function (g) { return g.id === gid; })[0]; }
  function siblings(sid, iid) {
    var it = itemById(sid, iid), all = itemsOf(sid);
    return groupsOf(sid).length > 1 && it ? all.filter(function (i) { return groupOf(i) === groupOf(it); }) : all;
  }
  function move(sid, iid, d) {
    var ids = itemsOf(sid).map(function (i) { return i.id; });
    var sib = siblings(sid, iid).map(function (i) { return i.id; });
    var j = sib.indexOf(iid), other = sib[j + d];
    if (j < 0 || !other) return;
    var k = ids.indexOf(iid), n = ids.indexOf(other);
    var t = ids[k]; ids[k] = ids[n]; ids[n] = t;
    user.order[sid] = ids; save(); render();
  }

  /* ---------- routing ---------- */
  function parse() {
    var p = location.hash.replace(/^#\/?/, '').split('/');
    if (p[0] === 's' && p[1] && p[2] === 'g' && p[3]) return { v: 'sub', sid: p[1], gid: p[3] };
    if (p[0] === 's' && p[1]) return { v: p[2] ? 'item' : 'sub', sid: p[1], iid: p[2] };
    return { v: 'home' };
  }
  function go(h) { if (location.hash === h) render(); else location.hash = h; }
  window.addEventListener('hashchange', render);
  $('#back').onclick = function () {
    var r = parse();
    if (r.v === 'item') {
      var it = itemById(r.sid, r.iid);
      go(it && groupsOf(r.sid).length > 1 ? '#/s/' + r.sid + '/g/' + groupOf(it) : '#/s/' + r.sid);
    } else if (r.gid) go('#/s/' + r.sid);
    else go('#/');
  };

  /* ---------- rendering ---------- */
  function setHead(title, acts) {
    $('#title').textContent = title;
    $('#acts').innerHTML = acts || '';
    document.body.classList.toggle('sub', parse().v !== 'home');
  }
  function render() {
    exitFs(); cardKeys = null;
    var r = parse(), v = $('#view');
    if (r.v === 'home') home(v);
    else if (r.v === 'sub') sub(v, r.sid, r.gid);
    else item(v, r.sid, r.iid);
    v.scrollTop = 0;
  }

  /* home */
  function home(v) {
    editing = false;
    setHead('Учебный хаб', '');
    var secs = sections();
    v.innerHTML = '<div class="page"><div class="hello">Привет 👋</div><p class="sub-t">Выбери тему и открой нужный конспект.</p>' +
      '<input class="search" id="q" type="search" placeholder="Поиск по всем материалам…">' +
      '<div id="hits"></div><div class="grid" id="tiles">' +
      secs.map(function (s) {
        var n = itemsOf(s.id).length;
        return '<div class="tile" data-sec="' + esc(s.id) + '"><div class="ico">' + esc(s.icon || '📁') + '</div><div><h3>' + esc(s.title) + '</h3><small>' + n + ' ' + plural(n) + '</small></div></div>';
      }).join('') + '<div class="tile add" id="newSec"><div><div class="ico">＋</div><h3>Новая тема</h3></div></div></div></div>';
    v.querySelector('#newSec').onclick = sectionForm;
    v.querySelector('#q').oninput = function () {
      var q = this.value.trim().toLowerCase(), hits = [];
      if (q) secs.forEach(function (s) { itemsOf(s.id).forEach(function (i) { if ((i.title + ' ' + s.title).toLowerCase().indexOf(q) > -1) hits.push([s, i]); }); });
      $('#tiles').style.display = q ? 'none' : '';
      $('#hits').innerHTML = q ? (hits.length ? '<div class="hits">' + hits.map(function (h) {
        return '<div class="row" data-item="' + esc(h[0].id) + '/' + esc(h[1].id) + '"><div class="tt"><b>' + esc(h[1].title) + '</b><small>' + esc(h[0].title) + '</small></div><span class="go">›</span></div>';
      }).join('') + '</div>' : '<div class="empty">Ничего не найдено</div>') : '';
    };
  }
  function plural(n) { var a = n % 10, b = n % 100; return (a === 1 && b !== 11) ? 'материал' : (a >= 2 && a <= 4 && (b < 10 || b >= 20)) ? 'материала' : 'материалов'; }

  /* subject */
  function sub(v, sid, gid) {
    var s = section(sid);
    if (!s) return go('#/');
    var grps = groupsOf(sid);
    if (gid && !group(gid)) return go('#/s/' + sid);
    if (!gid && grps.length > 1) {
      editing = false;
      setHead((s.icon || '') + ' ' + s.title, '');
      v.onclick = null;
      v.innerHTML = '<div class="page"><div class="toolbar">' +
        '<button class="ib primary" id="upBtn">⬆ Загрузить файлы</button>' +
        '<button class="ib" id="addBtn">＋ Создать</button></div><div class="grid">' +
        grps.map(function (g) {
          var n = itemsOf(sid).filter(function (i) { return groupOf(i) === g.id; }).length;
          return '<div class="tile" data-grp="' + esc(sid) + '/g/' + g.id + '"><div class="ico">' + g.icon + '</div><div><h3>' + g.title + '</h3><small>' + n + ' ' + plural(n) + '</small></div></div>';
        }).join('') + '</div></div>';
      v.querySelector('#upBtn').onclick = function () { pickFiles(sid); };
      v.querySelector('#addBtn').onclick = function () { itemForm(sid); };
      return;
    }
    var g = gid && group(gid);
    setHead(g ? g.icon + ' ' + g.title : (s.icon || '') + ' ' + s.title, '<button class="ib' + (editing ? ' primary' : '') + '" id="edBtn">' + (editing ? 'Готово' : 'Порядок') + '</button>');
    $('#edBtn').onclick = function () { editing = !editing; render(); };
    var items = itemsOf(sid).filter(function (i) { return !gid || groupOf(i) === gid; });
    var html = '<div class="page"><div class="toolbar">' +
      '<button class="ib primary" id="upBtn">⬆ Загрузить файлы</button>' +
      '<button class="ib" id="addBtn">＋ Создать</button></div>';
    if (!items.length) html += '<div class="empty">Здесь пока пусто.<br>Загрузи конспекты (.docx, .md, .txt, .html) или создай материал.</div>';
    else {
      html += '<div class="list">' + items.map(function (i, n) {
        var tools = editing ? '<span class="tools">' +
          '<button class="ib" data-mv="-1" data-id="' + esc(i.id) + '"' + (n === 0 ? ' disabled style="opacity:.35"' : '') + '>▲</button>' +
          '<button class="ib" data-mv="1" data-id="' + esc(i.id) + '"' + (n === items.length - 1 ? ' disabled style="opacity:.35"' : '') + '>▼</button>' +
          (i.user ? '<button class="ib" data-ren="' + esc(i.id) + '">✎</button><button class="ib danger" data-del="' + esc(i.id) + '">🗑</button>' : '') + '</span>' : '<span class="go">›</span>';
        return '<div class="row" ' + (editing ? '' : 'data-item="' + esc(sid) + '/' + esc(i.id) + '"') + '><span class="num">' + (n + 1) + '</span>' +
          '<div class="tt"><b>' + esc(i.title) + '</b><small>' + (TYPE[i.type] || i.type) + (i.user ? ' · мой' : '') + '</small></div>' + tools + '</div>';
      }).join('') + '</div>';
    }
    if (editing) {
      html += '<div class="foot-tools"><button class="ib" id="cpOrder">Скопировать порядок</button>' +
        '<button class="ib" id="rstOrder">Сбросить порядок</button>' +
        (s.user ? '<button class="ib danger" id="delSec">Удалить тему</button>' : '') + '</div>' +
        '<p class="sub-t" style="margin-top:12px">Двигай стрелками. Материалы из репозитория удалить здесь нельзя: напиши мне, и я уберу или переставлю их там.</p>';
    }
    v.innerHTML = html + '</div>';
    v.querySelector('#upBtn').onclick = function () { pickFiles(sid); };
    v.querySelector('#addBtn').onclick = function () { itemForm(sid); };
    if (editing) {
      v.onclick = function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.dataset.mv) move(sid, b.dataset.id, +b.dataset.mv);
        else if (b.dataset.ren) {
          var it = user.items.filter(function (x) { return x.id === b.dataset.ren; })[0];
          var nt = it && prompt('Новое название', it.title);
          if (nt && nt.trim()) { it.title = nt.trim(); save(); render(); }
        } else if (b.dataset.del) {
          var it2 = user.items.filter(function (x) { return x.id === b.dataset.del; })[0];
          if (it2 && confirm('Удалить «' + it2.title + '»?')) { user.items = user.items.filter(function (x) { return x !== it2; }); save(); render(); toast('Удалено'); }
        }
      };
      v.querySelector('#cpOrder').onclick = function () {
        var txt = s.title + ':\n' + itemsOf(sid).map(function (i, n) { return (n + 1) + '. ' + i.title; }).join('\n');
        if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { toast('Порядок скопирован'); }, function () { toast('Не удалось скопировать'); });
      };
      v.querySelector('#rstOrder').onclick = function () { delete user.order[sid]; save(); render(); toast('Порядок сброшен'); };
      var ds = v.querySelector('#delSec');
      if (ds) ds.onclick = function () {
        if (!confirm('Удалить тему «' + s.title + '» со всеми моими материалами?')) return;
        user.sections = user.sections.filter(function (x) { return x.id !== sid; });
        user.items = user.items.filter(function (x) { return x.sectionId !== sid; });
        delete user.order[sid]; save(); go('#/');
      };
    } else v.onclick = null;
  }

  /* item */
  function item(v, sid, iid) {
    v.onclick = null;
    var it = itemById(sid, iid), s = section(sid);
    if (!it || !s) return go('#/s/' + sid);
    var acts = '';
    if (it.type === 'page') acts += '<button class="ib" id="fsBtn">⛶</button>';
    setHead(it.title, acts);
    var fb = $('#fsBtn'); if (fb) fb.onclick = enterFs;
    if (it.type === 'markdown') renderMd(it, v, sid);
    else if (it.type === 'doc') v.innerHTML = '<div class="page doc">' + clean(it.html) + pn(sid, iid) + '</div>';
    else if (it.type === 'cards') cards(it, v);
    else if (it.type === 'page') pageView(it, v);
    else v.innerHTML = '<div class="page"><a style="color:var(--accent)" target="_blank" rel="noopener" href="' + esc(it.url) + '">Открыть: ' + esc(it.url) + '</a></div>';
  }
  function clean(h) { return window.DOMPurify ? DOMPurify.sanitize(h) : esc(h); }
  function md(t) {
    var out = window.marked ? clean(marked.parse(t)) : '<pre>' + esc(t) + '</pre>';
    return out.replace(/<p>\s*@@graph:([a-z0-9_-]+)@@\s*<\/p>/g, '<div class="wg-slot" data-w="$1"></div>');
  }
  function pn(sid, iid) {
    var items = siblings(sid, iid), k = items.map(function (i) { return i.id; }).indexOf(iid);
    var p = items[k - 1], n = items[k + 1];
    if (!p && !n) return '';
    return '<div class="pn">' + (p ? '<button class="ib" data-item="' + esc(sid) + '/' + esc(p.id) + '">‹ ' + esc(p.title) + '</button>' : '') +
      (n ? '<button class="ib" style="justify-content:flex-end;text-align:right" data-item="' + esc(sid) + '/' + esc(n.id) + '">' + esc(n.title) + ' ›</button>' : '') + '</div>';
  }
  var cache = {};
  function renderMd(it, v, sid) {
    var put = function (t) { if (parse().iid === it.id) { v.innerHTML = '<div class="page doc">' + md(t) + pn(sid, it.id) + '</div>'; if (window.HubWidgets) HubWidgets.mountAll(v); } };
    if (it.text != null) return put(it.text);
    if (cache[it.src]) return put(cache[it.src]);
    v.innerHTML = '<div class="page">Загрузка…</div>';
    fetch(it.src).then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .then(function (t) { cache[it.src] = t; put(t); })
      .catch(function () { v.innerHTML = '<div class="page">Не удалось загрузить файл ' + esc(it.src) + '.</div>'; });
  }
  function pageView(it, v) {
    var f = it.html != null
      ? '<iframe class="pf" allowfullscreen allow="fullscreen" sandbox="allow-scripts allow-popups allow-forms"></iframe>'
      : '<iframe class="pf" allowfullscreen allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" src="' + esc(it.url) + '"></iframe>';
    v.innerHTML = '<div class="pagewrap">' + f + '</div>';
    if (it.html != null) v.querySelector('iframe').srcdoc = it.html;
  }
  function enterFs() {
    var w = document.querySelector('.pagewrap'); if (!w) return;
    document.body.classList.add('fs');
    try { var r = w.requestFullscreen || w.webkitRequestFullscreen; if (r) { var p = r.call(w); if (p && p.catch) p.catch(function () {}); } } catch (e) {}
  }
  function exitFs() {
    document.body.classList.remove('fs');
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch (e) {}
  }
  $('#fsExit').onclick = exitFs;
  document.addEventListener('fullscreenchange', function () { if (!document.fullscreenElement) document.body.classList.remove('fs'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') exitFs();
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (cardKeys) cardKeys(e);
  });

  /* flashcards: карточка переворачивается, на обороте ответ */
  function cards(it, v) {
    var deck = (it.cards || []).slice(), idx = 0, known = {}, flipped = false, busy = false;
    if (!deck.length) { v.innerHTML = '<div class="page">В колоде нет карточек.</div>'; return; }
    function face() {
      var c = deck[idx], card = v.querySelector('#flip'); if (!card) return;
      card.classList.toggle('back', flipped);
      card.querySelector('.lab').textContent = flipped ? 'ответ' : 'вопрос';
      card.querySelector('.txt').textContent = flipped ? c.a : c.q;
      card.querySelector('.tap').textContent = flipped ? 'нажми, чтобы вернуться к вопросу ↻' : 'нажми, чтобы увидеть ответ ↻';
      var fb = v.querySelector('#fl'); if (fb) fb.textContent = flipped ? 'Показать вопрос' : 'Перевернуть';
    }
    function turn() {
      var card = v.querySelector('#flip'); if (!card || busy) return;
      busy = true; card.classList.add('turn');
      setTimeout(function () { flipped = !flipped; face(); card.classList.remove('turn'); setTimeout(function () { busy = false; }, 190); }, 190);
    }
    function draw() {
      var done = Object.keys(known).length;
      v.innerHTML = '<div class="fc"><div class="progress">Карточка ' + (idx + 1) + ' из ' + deck.length + ' · знаю: ' + done + '</div>' +
        '<div class="bar"><i style="width:' + (done / deck.length * 100) + '%"></i></div>' +
        '<div class="flipwrap"><div class="card3" id="flip"><span class="lab"></span><span class="txt"></span><span class="tap"></span></div></div>' +
        '<div class="brow"><button class="ib" id="prev">‹ Назад</button><button class="ib primary" id="fl">Перевернуть</button><button class="ib" id="next">Далее ›</button></div>' +
        '<div class="brow"><button class="ib danger" id="again">Повторить позже</button><button class="ib" id="know" style="border-color:var(--ok)">Знаю ✓</button></div>' +
        '<div class="brow"><button class="ib" id="shuf">Перемешать</button><button class="ib" id="reset">Сначала</button></div></div>';
      busy = false; face();
      v.querySelector('#flip').onclick = turn;
      v.querySelector('#fl').onclick = turn;
      v.querySelector('#prev').onclick = function () { step(-1); };
      v.querySelector('#next').onclick = function () { step(1); };
      v.querySelector('#know').onclick = function () { known[idx] = 1; if (Object.keys(known).length === deck.length) { toast('Вся колода пройдена 🎉'); draw(); } else step(1); };
      v.querySelector('#again').onclick = function () { delete known[idx]; step(1); };
      v.querySelector('#shuf').onclick = function () { deck.sort(function () { return Math.random() - .5; }); idx = 0; known = {}; flipped = false; draw(); };
      v.querySelector('#reset').onclick = function () { idx = 0; known = {}; flipped = false; draw(); };
    }
    function step(d) { idx = (idx + d + deck.length) % deck.length; flipped = false; draw(); }
    draw();
    cardKeys = function (e) {
      if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
      else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); turn(); }
    };
  }

  /* ---------- modals ---------- */
  function modal(html, ready) {
    $('#modal').innerHTML = html; $('#modalBg').classList.add('on');
    var c = $('#modal').querySelector('[data-close]'); if (c) c.onclick = closeModal;
    if (ready) ready($('#modal'));
  }
  function closeModal() { $('#modalBg').classList.remove('on'); }
  $('#modalBg').addEventListener('mousedown', function (e) { if (e.target === this) closeModal(); });

  function sectionForm() {
    modal('<h2>Новая тема</h2><label>Название</label><input type="text" id="f-title" placeholder="Например: История">' +
      '<label>Значок (эмодзи)</label><input type="text" id="f-icon" value="📁" maxlength="4">' +
      '<div class="actions"><button class="ib" data-close>Отмена</button><button class="ib primary" id="f-ok">Создать</button></div>',
      function (m) {
        m.querySelector('#f-ok').onclick = function () {
          var t = m.querySelector('#f-title').value.trim();
          if (!t) return toast('Введи название');
          var s = { id: uid('s'), title: t, icon: m.querySelector('#f-icon').value || '📁' };
          user.sections.push(s); save(); closeModal(); go('#/s/' + s.id);
        };
      });
  }

  function itemForm(sid) {
    modal('<h2>Новый материал</h2>' +
      '<label>Название</label><input type="text" id="f-title" placeholder="Например: Тема II. Метод экономической теории">' +
      '<label>Тип</label><select id="f-type"><option value="markdown">Конспект / текст (Markdown)</option><option value="cards">Карточки для повторения</option><option value="page">Страница или презентация (HTML-код)</option><option value="url">Страница по адресу</option></select>' +
      '<label id="f-lbl"></label><textarea id="f-body"></textarea><div class="note" id="f-note"></div>' +
      '<div class="actions"><button class="ib" data-close>Отмена</button><button class="ib primary" id="f-ok">Добавить</button></div>',
      function (m) {
        var type = m.querySelector('#f-type'), lbl = m.querySelector('#f-lbl'), body = m.querySelector('#f-body'), note = m.querySelector('#f-note');
        function sync() {
          var t = type.value; note.textContent = ''; body.style.minHeight = '150px';
          if (t === 'markdown') { lbl.textContent = 'Текст (Markdown: # заголовки, **жирный**, списки, таблицы)'; body.placeholder = ''; }
          if (t === 'cards') { lbl.textContent = 'Карточки: каждая строка — «вопрос | ответ»'; body.placeholder = 'Что такое спрос? | Желание и возможность купить товар'; }
          if (t === 'page') { lbl.textContent = 'HTML-код'; body.placeholder = '<!doctype html>…'; note.textContent = 'Откроется в защищённой рамке, скрипты работают.'; }
          if (t === 'url') { lbl.textContent = 'Адрес'; body.placeholder = 'https://…'; body.style.minHeight = '44px'; note.textContent = 'Некоторые сайты запрещают встраивание.'; }
        }
        type.onchange = sync; sync();
        m.querySelector('#f-ok').onclick = function () {
          var title = m.querySelector('#f-title').value.trim(), val = body.value.trim(), t = type.value;
          if (!title || !val) return toast('Заполни название и содержимое');
          var it = { id: uid('i'), sectionId: sid, title: title };
          if (t === 'markdown') { it.type = 'markdown'; it.text = val; }
          else if (t === 'cards') {
            it.type = 'cards';
            it.cards = val.split('\n').map(function (l) { var p = l.split('|'); return { q: (p.shift() || '').trim(), a: p.join('|').trim() }; }).filter(function (c) { return c.q && c.a; });
            if (!it.cards.length) return toast('Нужна хотя бы одна строка «вопрос | ответ»');
          } else if (t === 'page') { it.type = 'page'; it.html = val; }
          else { it.type = 'page'; it.url = val; }
          user.items.push(it); save(); closeModal(); go('#/s/' + sid + '/' + it.id);
        };
      });
  }

  /* ---------- file upload ---------- */
  var uploadSid = null;
  function pickFiles(sid) { uploadSid = sid; $('#fileIn').click(); }
  function loadScript(src) {
    return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  }
  function readText(f) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsText(f); }); }
  function readBuf(f) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsArrayBuffer(f); }); }
  function fileItem(f, sid) {
    var name = f.name.replace(/\.[^.]+$/, ''), ext = (f.name.split('.').pop() || '').toLowerCase();
    var it = { id: uid('i'), sectionId: sid, title: name };
    if (ext === 'md' || ext === 'markdown' || ext === 'txt') {
      return readText(f).then(function (t) { it.type = 'markdown'; it.text = t; var m = /^#\s+(.+)$/m.exec(t); if (m && ext !== 'txt') it.title = m[1].trim(); return it; });
    }
    if (ext === 'html' || ext === 'htm') return readText(f).then(function (t) { it.type = 'page'; it.html = t; return it; });
    if (ext === 'docx') {
      return (window.mammoth ? Promise.resolve() : loadScript('lib/mammoth.browser.min.js'))
        .then(function () { return readBuf(f); })
        .then(function (b) { return mammoth.convertToHtml({ arrayBuffer: b }); })
        .then(function (r) { it.type = 'doc'; it.html = clean(r.value); return it; });
    }
    return Promise.reject(new Error('Формат .' + ext + ' не поддерживается'));
  }
  $('#fileIn').onchange = function () {
    var files = Array.prototype.slice.call(this.files), sid = uploadSid; this.value = '';
    if (!files.length || !sid) return;
    toast('Загружаю…');
    var ok = 0, bad = [];
    files.reduce(function (p, f) {
      return p.then(function () { return fileItem(f, sid).then(function (it) { user.items.push(it); ok++; }, function (e) { bad.push(f.name + ' (' + (e && e.message || 'ошибка') + ')'); }); });
    }, Promise.resolve()).then(function () {
      if (ok) save();
      render();
      toast(ok ? 'Добавлено: ' + ok + (bad.length ? '. Не удалось: ' + bad.join(', ') : '') : 'Не удалось: ' + bad.join(', '));
    });
  };

  /* ---------- global clicks ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-sec],[data-item],[data-grp]');
    if (!t || e.target.closest('.tools')) return;
    if (t.dataset.sec) go('#/s/' + t.dataset.sec);
    else if (t.dataset.grp) go('#/s/' + t.dataset.grp);
    else if (t.dataset.item) go('#/s/' + t.dataset.item);
  });

  /* ---------- start ---------- */
  Promise.all([
    fetch('data/sections.json').then(function (r) { return r.json(); }).catch(function () { toast('Не удалось загрузить список материалов'); return { sections: [] }; }),
    loadUser()
  ]).then(function (res) { base = res[0]; user = res[1]; render(); });

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
